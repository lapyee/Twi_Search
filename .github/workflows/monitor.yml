name: X Keyword Tracker

on:
  schedule:
    - cron: '*/15 * * * *' # 每 15 分鐘在雲端自動執行一次
  workflow_dispatch: # 支援在手機上手動觸發

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Packages
        run: pip install requests
      - name: Run Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
